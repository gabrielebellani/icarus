services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${ICARUS_BACKEND_PORT:-8921}:3465"
      - "6499:6499"
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3465/api/status",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
  redis-cache:
    image: redis:8-alpine
    ports:
      - "${ICARUS_REDIS_PORT:-6379}:6379"
    volumes:
      - "redis-cache:/data"
    restart: unless-stopped
  jetapi-scraper:
    image: ghcr.io/gabrielebellani/jetapi_scarper_docker:1.0.0
    ports:
      - "${JETAPI_SCRAPER_PORT:-8922}:8922"
volumes:
  "redis-cache":
    driver: local
networks:
  default:
    name: icarus
    driver: bridge
