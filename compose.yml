services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${ICARUS_BACKEND_PORT:-8921}:3465"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3465/api/status",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
