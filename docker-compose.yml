services:
  # Frontend: SPA served via Caddy, reverse-proxying /api to icarus-backend
  icarus-frontend:
    image: ghcr.io/gabrielebellani/icarus-frontend:latest
    container_name: icarus-frontend
    ports:
      - "${FRONTEND_PORT:-8920}:80"
    depends_on:
      icarus-backend:
        condition: service_healthy
    networks:
      - icarus
    restart: unless-stopped

  # Backend: API server and WebSocket handler
  icarus-backend:
    image: ghcr.io/gabrielebellani/icarus-backend:latest
    container_name: icarus-backend
    environment:
      PORT: "8921"
      SUPERUSER_USERNAME: ${SUPERUSER_USERNAME}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JETAPI_URL: http://jetapi-scraper:8922
      FRONTEND_URL: ${FRONTEND_URL}
      DB_PATH: /app/data/icarus-db.sqlite
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-true}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
    volumes:
      - backend-data:/app/data
    depends_on:
      - jetapi-scraper
    networks:
      - icarus
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8921/api/status",
        ]
      interval: 4s
      timeout: 10s
      retries: 3

  # External service: aircraft image and information scraper
  jetapi-scraper:
    image: ghcr.io/gabrielebellani/jetapi_scraper_docker:latest
    container_name: icarus-jetapi
    networks:
      - icarus
    restart: unless-stopped

volumes:
  backend-data:
    driver: local

networks:
  icarus:
    driver: bridge
