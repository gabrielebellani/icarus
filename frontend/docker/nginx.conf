# Nginx configuration for Icarus frontend + reverse proxy to backend

# Upstream backend service (must match service name in docker-compose.yml)
upstream backend {
    server backend:3465;
}

server {
    listen 80;
    server_name _;

    # Gzip compression for better performance
    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/javascript;
    gzip_min_length 1024;

    # Serve SPA static files with caching
    location / {
        root /usr/share/nginx/html;

        # SPA routing: serve index.html for all non-file requests
        try_files $uri $uri/ /index.html;

        # Cache busting: set short expiry for HTML, longer for versioned assets
        add_header Cache-Control "public, max-age=3600";
    }

    # Versioned/hashed assets (from build): cache for 1 year
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Proxy /api requests to the backend service
    location /api/ {
        proxy_pass http://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support: upgrade connection and keep it alive
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Health check endpoint for the backend (proxied for monitoring)
    location /api/status {
        proxy_pass http://backend/api/status;
    }
}
